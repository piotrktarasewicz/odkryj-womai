<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Odkryj WOMAI — panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/theme.css?v=20261017-3" />
  <link rel="stylesheet" href="../css/admin.css?v=20261017-3" />
</head>
<body>
  <a class="skip-link" href="#main">Przejdź do treści</a>

  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <div class="brand-mark">
          <img class="brand-logo" src="../assets/logo-womai-black.png?v=20260719-1" width="392" height="122" alt="Logo WOMAI" decoding="async" />
        </div>
        <div>
          <div class="header-title">Panel pytań</div>
          <div class="header-account" id="account">Sprawdzanie logowania…</div>
        </div>
      </div>
      <a class="logout" href="/cdn-cgi/access/logout">Wyloguj</a>
    </div>
    <nav class="tabs" aria-label="Sekcje panelu">
      <button type="button" class="tab" data-view="home">Do zrobienia</button>
      <button type="button" class="tab" data-view="all">Wszystkie pytania</button>
      <button type="button" class="tab" data-view="tools" id="toolsTab" hidden>Narzędzia</button>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div id="view"></div>
  </main>

  <script src="../js/config.js?v=20261017-3"></script>
  <script src="../js/api.js?v=20261017-3"></script>
  <script src="../js/admin.js?v=20261017-3"></script>
</body>
</html>
