name = "odkryj-womai-admin-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

# Listy adresów SUPERADMINS i ADMINS ustawia się w panelu Cloudflare
# (Workers & Pages -> odkryj-womai-admin-api -> Settings -> Variables and Secrets,
# typ Text). Ta opcja sprawia, że wdrożenie ich nie kasuje.
keep_vars = true

# Worker obsługuje tylko API panelu administratora. Ta ścieżka leży pod
# /odkryj-womai/admin/, więc chroni ją ta sama aplikacja Cloudflare Access.
routes = [
  { pattern = "ptprojects.app/odkryj-womai/admin/api/*", zone_name = "ptprojects.app" }
]

[vars]
APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxjT94bgmFWki3G3uC-YxRg7udGUDSRWRMXcC2B3xSjOJTfVkx8bKUWCOnRfd6iHBPP/exec"
ACCESS_TEAM_DOMAIN = "womai.cloudflareaccess.com"
ACCESS_AUD = "f87eca897045b309d2c8568be18b187f5548f99b6e4ed338b4d1758acb7983b3"

# Sekrety ustawiane poza repozytorium (wrangler secret put NAZWA):
#   ADMIN_TOKEN       token roli admin z Apps Script
#   SUPERADMIN_TOKEN  token roli superadmin z Apps Script
#
# Zmienne ustawiane w panelu Cloudflare (nie w tym pliku, bo repozytorium
# jest publiczne):
#   SUPERADMINS       adresy e-mail superadminów, rozdzielone przecinkami
#   ADMINS            adresy e-mail adminów, rozdzielone przecinkami
